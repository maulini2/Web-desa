
<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Admin — Semparuk Sutera</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

/* =========================================================
   ROOT
========================================================= */

:root{

    --primary:#588157;
    --primary-dark:#3a5a40;
    --secondary:#a3b18a;
    --accent:#dad7cd;

    --bg:#f3f1eb;
    --card:#ffffff;
    --soft:#faf9f5;

    --text:#26362b;
    --muted:#748074;

    --navy:#344e41;

    --border:rgba(52,78,65,.12);

    --shadow:
        0 25px 70px rgba(52,78,65,.13);

}


/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html{
    scroll-behavior:smooth;
}


body{

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;

    font-family:"Inter",sans-serif;

    color:var(--text);

    background:

        radial-gradient(
            circle at 10% 15%,
            rgba(163,177,138,.28),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 85%,
            rgba(88,129,87,.16),
            transparent 30%
        ),

        var(--bg);

    overflow:hidden;

}


/* =========================================================
   BACKGROUND DECORATION
========================================================= */

body::before{

    content:"";

    position:fixed;

    width:420px;
    height:420px;

    border-radius:50%;

    border:1px solid rgba(88,129,87,.10);

    top:-220px;
    right:-160px;

    pointer-events:none;

}


body::after{

    content:"";

    position:fixed;

    width:330px;
    height:330px;

    border-radius:50%;

    border:1px solid rgba(58,90,64,.08);

    bottom:-190px;
    left:-140px;

    pointer-events:none;

}


/* =========================================================
   LOGIN WRAPPER
========================================================= */

.login-wrapper{

    width:100%;
    max-width:450px;

    position:relative;

    z-index:2;

}


/* =========================================================
   TOP BRAND
========================================================= */

.brand-top{

    text-align:center;

    margin-bottom:18px;

    animation:
        fadeDown .6s ease both;

}


.brand-top span{

    display:inline-flex;

    align-items:center;
    gap:7px;

    padding:7px 13px;

    border-radius:30px;

    background:rgba(88,129,87,.09);

    border:1px solid rgba(88,129,87,.12);

    color:var(--primary-dark);

    font-size:10px;

    font-weight:800;

    letter-spacing:1.4px;

    text-transform:uppercase;

}


.brand-top i{

    font-size:9px;

    color:var(--primary);

}


/* =========================================================
   LOGIN CARD
========================================================= */

.login-card{

    width:100%;

    background:

        linear-gradient(
            180deg,
            rgba(255,255,255,.98),
            rgba(255,255,255,1)
        );

    border:1px solid var(--border);

    border-radius:28px;

    padding:40px;

    box-shadow:var(--shadow);

    position:relative;

    overflow:hidden;

    animation:
        fadeUp .7s ease both;

}


/* top accent */

.login-card::before{

    content:"";

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:5px;

    background:
        linear-gradient(
            90deg,
            var(--primary-dark),
            var(--primary),
            var(--secondary)
        );

}


/* subtle corner */

.login-card::after{

    content:"";

    position:absolute;

    width:150px;
    height:150px;

    border-radius:50%;

    background:rgba(163,177,138,.10);

    top:-90px;
    right:-70px;

    pointer-events:none;

}


/* =========================================================
   LOGO
========================================================= */

.logo{

    text-align:center;

    margin-bottom:30px;

    position:relative;

    z-index:1;

}


.logo-icon{

    width:72px;
    height:72px;

    margin:0 auto 18px;

    border-radius:22px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:white;

    font-size:25px;

    background:

        linear-gradient(
            145deg,
            var(--primary-dark),
            var(--primary)
        );

    box-shadow:

        0 12px 25px
        rgba(58,90,64,.22);

    position:relative;

}


.logo-icon::after{

    content:"";

    position:absolute;

    inset:5px;

    border-radius:18px;

    border:1px solid
        rgba(255,255,255,.20);

}


.logo-icon i{

    position:relative;

    z-index:2;

}


.logo h1{

    font-family:
        "Plus Jakarta Sans",
        sans-serif;

    font-size:25px;

    line-height:1.2;

    font-weight:800;

    color:var(--navy);

    margin-bottom:8px;

}


.logo h1 span{

    color:var(--primary);

}


.logo p{

    font-size:12px;

    color:var(--muted);

    line-height:1.6;

}


/* =========================================================
   ERROR
========================================================= */

.error{

    display:none;

    margin-bottom:18px;

    padding:13px 15px;

    border-radius:13px;

    background:#fff1f1;

    border:1px solid #f3cccc;

    color:#b83a45;

    font-size:12px;

    line-height:1.5;

    animation:
        shake .3s ease;

}


.error.show{

    display:flex;

    align-items:center;

    gap:10px;

}


.error.show::before{

    content:"\f06a";

    font-family:
        "Font Awesome 6 Free";

    font-weight:900;

    font-size:14px;

}


/* =========================================================
   FORM
========================================================= */

.form-group{

    margin-bottom:19px;

}


.form-group label{

    display:block;

    font-size:12px;

    font-weight:800;

    color:var(--navy);

    margin-bottom:8px;

}


.input-wrapper{

    position:relative;

}


.input-wrapper i{

    position:absolute;

    left:16px;

    top:50%;

    transform:translateY(-50%);

    color:#87968a;

    font-size:13px;

    transition:.25s;

    z-index:2;

}


.input-wrapper input{

    width:100%;

    height:53px;

    padding:
        0 16px
        0 45px;

    border-radius:14px;

    border:1px solid var(--border);

    outline:none;

    font-family:inherit;

    font-size:13px;

    color:var(--text);

    background:var(--soft);

    transition:

        border-color .25s,
        box-shadow .25s,
        background .25s;

}


.input-wrapper input::placeholder{

    color:#9aa69c;

}


.input-wrapper input:hover{

    border-color:
        rgba(88,129,87,.28);

}


.input-wrapper input:focus{

    background:white;

    border-color:var(--primary);

    box-shadow:

        0 0 0 4px
        rgba(88,129,87,.10);

}


.input-wrapper:focus-within i{

    color:var(--primary);

}


/* =========================================================
   LOGIN BUTTON
========================================================= */

.login-btn{

    width:100%;

    height:53px;

    border:0;

    border-radius:14px;

    background:

        linear-gradient(
            135deg,
            var(--primary-dark),
            var(--primary)
        );

    color:white;

    font-family:inherit;

    font-size:13px;

    font-weight:800;

    cursor:pointer;

    transition:

        transform .25s,
        box-shadow .25s,
        filter .25s;

    margin-top:3px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    box-shadow:

        0 10px 22px
        rgba(58,90,64,.18);

}


.login-btn i{

    font-size:12px;

}


.login-btn:hover{

    transform:translateY(-2px);

    box-shadow:

        0 14px 28px
        rgba(58,90,64,.25);

    filter:brightness(1.04);

}


.login-btn:active{

    transform:translateY(0);

}


/* =========================================================
   SECURITY NOTE
========================================================= */

.security-note{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    margin-top:17px;

    color:#8a968c;

    font-size:10px;

}


.security-note i{

    color:var(--primary);

    font-size:10px;

}


/* =========================================================
   BACK
========================================================= */

.back{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    margin-top:22px;

    color:var(--muted);

    text-decoration:none;

    font-size:11px;

    font-weight:600;

    transition:.25s;

}


.back i{

    font-size:10px;

    transition:.25s;

}


.back:hover{

    color:var(--primary);

}


.back:hover i{

    transform:translateX(-3px);

}


/* =========================================================
   FOOTER
========================================================= */

.footer-text{

    text-align:center;

    margin-top:18px;

    font-size:10px;

    color:#98a199;

}


.footer-text strong{

    color:#718071;

    font-weight:700;

}


/* =========================================================
   ANIMATION
========================================================= */

@keyframes fadeUp{

    from{

        opacity:0;

        transform:
            translateY(20px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


@keyframes fadeDown{

    from{

        opacity:0;

        transform:
            translateY(-10px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


@keyframes shake{

    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-4px);
    }

    75%{
        transform:translateX(4px);
    }

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:520px){

    body{

        padding:18px;

        overflow:auto;

    }


    .login-card{

        padding:32px 24px;

        border-radius:23px;

    }


    .logo h1{

        font-size:22px;

    }


    .logo-icon{

        width:65px;
        height:65px;

        border-radius:19px;

    }


    .brand-top{

        margin-bottom:14px;

    }

}


@media(max-width:360px){

    .login-card{

        padding:28px 20px;

    }

    .logo{

        margin-bottom:24px;

    }

}


/* =========================================================
   ACCESSIBILITY
========================================================= */

button:focus-visible,
input:focus-visible,
a:focus-visible{

    outline:

        3px solid
        rgba(88,129,87,.25);

    outline-offset:3px;

}

</style>

</head>


<body>


<div class="login-wrapper">


    <div class="brand-top">

        <span>

            <i class="fa-solid fa-leaf"></i>

            Semparuk Sutera

        </span>

    </div>



    <div class="login-card">


        <div class="logo">

            <div class="logo-icon">

                <i class="fa-solid fa-user-shield"></i>

            </div>


            <h1>
                Login <span>Admin</span>
            </h1>

            <p>
                Panel Administrasi Semparuk Sutera
            </p>

        </div>



        <div
            class="error"
            id="error">

            Username atau password salah.

        </div>



        <form id="loginForm">


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="username"
                        placeholder="Masukkan username"
                        autocomplete="username"
                        required>

                </div>

            </div>



            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required>

                </div>

            </div>



            <button
                type="submit"
                class="login-btn">

                <i class="fa-solid fa-right-to-bracket"></i>

                Masuk ke Dashboard

            </button>


        </form>



        <div class="security-note">

            <i class="fa-solid fa-shield-halved"></i>

            Akses khusus administrator

        </div>



        <a
            href="index.html"
            class="back">

            <i class="fa-solid fa-arrow-left"></i>

            Kembali ke Website

        </a>


    </div>



    <div class="footer-text">

        © 2026 <strong>Desa Semparuk Sutera</strong>

    </div>


</div>



<script>

/* =========================================
   LOGIN ADMIN
========================================= */

/*
   GANTI username dan password di bawah.
*/

const ADMIN_USERNAME = "admin";

const ADMIN_PASSWORD = "astrid123";


document
.getElementById("loginForm")
.addEventListener(
    "submit",
    function(e){

        e.preventDefault();


        const username =
            document
            .getElementById("username")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        const error =
            document
            .getElementById("error");


        if(
            username === ADMIN_USERNAME &&
            password === ADMIN_PASSWORD
        ){

            /*
             * Tandai bahwa admin
             * sudah login.
             */

            sessionStorage.setItem(
                "adminLoggedIn",
                "true"
            );


            /*
             * Masuk dashboard.
             */

            window.location.href =
                "admin.html";

        }else{

            error.classList.add("show");

        }

    }
);

</script>


</body>

</html>
